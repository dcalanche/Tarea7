<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante Gourmet - Reservas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sabor & Tradición</h1>
        <p>Reserva tu mesa en línea</p>
    </header>

    <main class="container">
        <!-- Formulario de reserva -->
        <section class="card">
            <h2>Hacer o Modificar una Reserva</h2>
            <form id="reserva-form">
                <!-- Campo oculto para manejar la edición -->
                <input type="hidden" id="id-reserva">

                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
                </div>
                
                <div class="form-group">
                    <label for="area">Área / Ubicación de la Mesa:</label>
                    <select id="area" required class="form-input">
                        <option value="" disabled selected>Selecciona un área...</option>
                        <option value="Terraza">Terraza (Al aire libre)</option>
                        <option value="Salón Principal">Salón Principal</option>
                        <option value="Área VIP">Área VIP</option>
                        <option value="Barra / Barra Alta">Barra / Barra Alta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="personas">Número de Personas:</label>
                    <input type="number" id="personas" min="1" max="20" required placeholder="1-20">
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha y Hora:</label>
                    <input type="datetime-local" id="fecha" required>
                </div>

                <div class="button-group">
                    <button type="submit" id="btn-guardar" class="btn primary">Guardar Reserva</button>
                    <button type="button" id="btn-cancelar" class="btn secondary" style="display: none;">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- Sección para visualizar y borrar datos -->
        <section class="card">
            <h2>Gestión de Reservas</h2>
            <div class="button-group">
                <button id="btn-mostrar" class="btn secondary">Mostrar Datos</button>
                <button id="btn-limpiar" class="btn danger">Limpiar Todo</button>
            </div>
            
            <div id="lista-reservas" class="reservas-container">
                <!-- Las reservas cargadas mediante JS aparecerán aquí -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Restaurante Sabor & Tradición | Estado DB: <span id="estado-db">Conectando...</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
